name: bindings-drift

# The Kotlin/Swift bindings are committed, so any change to the FFI crate must
# regenerate them byte-identically or this fails. Regenerates into a temp dir
# and diffs — never writes the tree.
#
# Why this file exists at the REPO ROOT rather than under `protocol/`
# ----------------------------------------------------------------------
# A drift guard was authored at `protocol/.github/workflows/bindings.yml` and
# is cited as live by `protocol/AGENTS.md` and `mobile/ios/BUILD.md`. It has
# never run. `protocol/` is a plain directory in this repo (there is no
# `.gitmodules`), so GitHub Actions — which only reads `<repo-root>/
# .github/workflows/` — never sees it. Nine workflows are sitting there inert,
# including this one.
#
# The only guard that did run was a Swift-only `diff` buried as a step inside
# the macOS iOS job of `ci-cd.yml`. Kotlin was entirely unguarded. The drift
# that let through: the 22-method chat API on `feat/ffi-chat-bindings` was
# merged into `light_node.rs` with the committed bindings untouched, so HEAD's
# `kovanica.kt` contained zero chat methods and mobile builds failed at
# runtime with "method not found".
#
# Paths below are all monorepo-relative (`protocol/` prefix) and cargo runs
# with `working-directory: protocol`, matching the workspace layout. The
# original used bare `crates/kovanica-ffi/**`, correct only when the repo root
# *was* `protocol/`.
#
# Runs on every PR touching the FFI crate (or this file). Cheap: one release
# build of kovanica-ffi plus two bindgen invocations.

on:
  pull_request:
    paths:
      - "protocol/crates/kovanica-ffi/**"
      - "protocol/Cargo.toml"
      - "protocol/Cargo.lock"
      - ".github/workflows/bindings-drift.yml"
  push:
    branches: [main]
    paths:
      - "protocol/crates/kovanica-ffi/**"
      - "protocol/Cargo.toml"
      - "protocol/Cargo.lock"
      - ".github/workflows/bindings-drift.yml"
  workflow_dispatch:

concurrency:
  group: bindings-drift-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  drift:
    name: Regenerate & diff bindings (Kotlin + Swift)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Pinned to the same 1.98.0 that `protocol/rust-toolchain.toml` names.
      # A different toolchain can emit differently-formatted bindings, which
      # would turn this guard into a coin flip on a change that never touched
      # the FFI surface.
      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0

      - name: Build FFI cdylib
        working-directory: protocol
        run: cargo build --release -p kovanica-ffi

      - name: Generate Kotlin bindings
        working-directory: protocol
        run: |
          mkdir -p /tmp/bindgen/kotlin
          cargo run -p kovanica-ffi --bin uniffi-bindgen -- \
            generate --library target/release/libkovanica_ffi.so \
            --language kotlin --out-dir /tmp/bindgen/kotlin

      - name: Generate Swift bindings
        working-directory: protocol
        run: |
          mkdir -p /tmp/bindgen/swift
          cargo run -p kovanica-ffi --bin uniffi-bindgen -- \
            generate --library target/release/libkovanica_ffi.so \
            --language swift --out-dir /tmp/bindgen/swift

      - name: Diff generated vs committed
        working-directory: protocol
        run: |
          set -euo pipefail
          # -x README.md: hand-written docs live beside generated output;
          # they are not bindgen artifacts and must not trip the guard.
          fail=0
          diff -r -x README.md /tmp/bindgen/kotlin crates/kovanica-ffi/bindings/kotlin \
            || fail=1
          diff -r -x README.md /tmp/bindgen/swift crates/kovanica-ffi/bindings/swift \
            || fail=1
          if [ "$fail" != "0" ]; then
            echo "::error::Committed bindings drifted from crates/kovanica-ffi."
            echo "Regenerate and commit (from the protocol/ directory):"
            echo "  cargo build --release -p kovanica-ffi"
            echo "  cargo run -p kovanica-ffi --bin uniffi-bindgen -- generate \\"
            echo "    --library target/release/libkovanica_ffi.so \\"
            echo "    --language kotlin --out-dir crates/kovanica-ffi/bindings/kotlin"
            echo "  cargo run -p kovanica-ffi --bin uniffi-bindgen -- generate \\"
            echo "    --library target/release/libkovanica_ffi.so \\"
            echo "    --language swift --out-dir crates/kovanica-ffi/bindings/swift"
          fi
          exit "$fail"

      # The packaging scripts are shell, not Rust: lint them here so a typo
      # cannot hide until someone runs them on a real machine.
      - name: Shellcheck packaging scripts
        working-directory: protocol
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck crates/kovanica-ffi/build-android.sh \
                    crates/kovanica-ffi/build-apple.sh

# KovanicaWallet iOS Project Configuration for xcodegen
# Generate with: xcodegen generate --spec apps/ios/xcodegen.yml
#
# ⚠️ Build order: the light-node FFI is a **binary** dependency. Run
#    protocol/crates/kovanica-ffi/build-apple.sh on macOS first — it produces
#    `target/kovanica.xcframework` and the generated Swift bindings this target
#    compiles. Without it the build fails at link time, which is the intended
#    signal: the app has exactly one key-derivation implementation and it lives
#    in that framework. See apps/ios/BUILD.md.

name: KovanicaWallet
options:
  bundleIdPrefix: com.kovanica
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  settings:
    base:
      SWIFT_VERSION: "5.9"
      IPHONEOS_DEPLOYMENT_TARGET: "17.0"
      CODE_SIGN_STYLE: Automatic
      DEVELOPMENT_TEAM: ""  # Set in Xcode or via env
      CURRENT_PROJECT_VERSION: "1"
      MARKETING_VERSION: "1.0.0"
      INFOPLIST_FILE: KovanicaWallet/Info.plist
      SWIFT_EMIT_LOC_STRINGS: YES
    debug:
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      ENABLE_TESTABILITY: YES
    release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      DEBUG_INFORMATION_FORMAT: "dwarf-with-dsym"

# Only the Keychain package is needed: key derivation is Rust-side (the FFI
# below), and key custody is the only client-side crypto left.
packages:
  KeychainSwift:
    url: https://github.com/evgenyneu/keychain-swift
    from: "24.0.0"

targets:
  KovanicaWallet:
    type: application
    platform: iOS
    sources:
      - path: KovanicaWallet
      # UniFFI-generated bindings, committed alongside the Rust crate and
      # regenerated by protocol/.github/workflows/bindings.yml. Compiled into
      # this target — the modulemap inside the xcframework names the symbols.
      - path: ../../protocol/crates/kovanica-ffi/bindings/swift/kovanica.swift
    dependencies:
      - package: KeychainSwift
      - framework: ../../protocol/crates/kovanica-ffi/target/kovanica.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kovanica.wallet
        INFOPLIST_KEY_UILaunchStoryboardName: LaunchScreen
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "['UIInterfaceOrientationPortrait']"
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Kovanica Wallet uses Face ID to secure your wallet."
        INFOPLIST_KEY_NSCameraUsageDescription: "Kovanica Wallet needs camera access to scan QR codes."
    scheme:
      testTargets: [KovanicaWalletTests]
      gatherCoverageData: true
      codeCoverageTargets:
        - KovanicaWallet

  KovanicaWalletTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: KovanicaWalletTests
      # Canonical golden vectors from the Rust core tree, loaded read-only.
      - path: ../../protocol/testvectors/vectors.json
        buildPhase: resources
    dependencies:
      - target: KovanicaWallet
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kovanica.wallet.tests

schemes:
  KovanicaWallet:
    build:
      targets:
        KovanicaWallet: all
        KovanicaWalletTests: test
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
    archive:
      config: Release
    profile:
      config: Release
    analyze:
      config: Debug

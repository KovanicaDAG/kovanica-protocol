[package]
name = "kovanica-enterprise-console"
version = "0.1.0"
description = "Kovanica Enterprise Console - Business wallet and asset management"
authors = ["Kovanica Protocol"]
license = "MIT"
repository = "https://github.com/kovanica/kovanica-protocol"
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.6", features = ["shell-open"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

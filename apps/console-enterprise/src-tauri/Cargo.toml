[package]
name = "kovanica-enterprise-console"
version = "0.1.0"
description = "Kovanica Enterprise Console - Business wallet and asset management"
authors = ["Kovanica Protocol"]
license = "MIT"
repository = "https://github.com/KovanicaDAG/kovanica-protocol"
edition = "2021"

# Named explicitly so `main.rs` and the shared shell agree on the target name.
[lib]
name = "kovanica_enterprise_console"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
kovanica-console-shell = { path = "../../console-shell" }
tauri = { version = "2", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

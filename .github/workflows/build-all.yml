name: Release Apps

# App-artifact release workflow (Phase 2 CI consolidation).
#
# The build/test gates that used to live here moved to `.github/workflows/ci.yml`.
# What remains is the tag-driven release of the Android APK/AAB and the Tauri
# desktop bundles. Kept separate and **tag-triggered or manual on purpose**:
# cutting a release is a maintainer decision. See `docs/unify/DECISIONS.md` #8.
#
# The archived original is at `archive/workflows/` for reference. The node
# binary release lives in `releases.yml`; the SDK publish lives in
# `publish-sdk.yml`.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  RUST_VERSION: "1.98.0"
  NODE_VERSION: "24"
  ANDROID_API: "34"
  ANDROID_NDK_VERSION: "25.2.9519653"

jobs:
  # ─────────────────────────────────────────────────────────────────
  # FFI Bindings (Kotlin + Swift) — builds first, consumed by apps
  # ─────────────────────────────────────────────────────────────────
  ffi-bindings:
    name: Generate FFI Bindings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Build kovanica-ffi
        working-directory: ./protocol
        run: cargo build -p kovanica-ffi --release

      # uniffi-bindgen reads the UDL/metadata out of the built library, so
      # this works on Linux for both target languages. Run it through the
      # workspace so the generator version is the one pinned by kovanica-ffi
      # rather than whatever `cargo install` resolved that day.
      - name: Generate Kotlin bindings
        working-directory: ./protocol
        run: |
          cargo run -p kovanica-ffi --bin uniffi-bindgen -- generate \
            --library ./target/release/libkovanica_ffi.so \
            --language kotlin \
            --out-dir ./bindings/kotlin/uniffi

      - name: Generate Swift bindings
        working-directory: ./protocol
        run: |
          cargo run -p kovanica-ffi --bin uniffi-bindgen -- generate \
            --library ./target/release/libkovanica_ffi.so \
            --language swift \
            --out-dir ./bindings/swift

      - name: Upload Kotlin bindings
        uses: actions/upload-artifact@v4
        with:
          name: kotlin-bindings
          path: protocol/bindings/kotlin/uniffi/
          retention-days: 7

      - name: Upload Swift bindings
        uses: actions/upload-artifact@v4
        with:
          name: swift-bindings
          path: protocol/bindings/swift/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────
  # Android APK
  # ─────────────────────────────────────────────────────────────────
  android:
    name: Android APK
    runs-on: ubuntu-latest
    needs: ffi-bindings
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: ${{ env.ANDROID_API }}
          ndk-version: ${{ env.ANDROID_NDK_VERSION }}

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Download Kotlin bindings
        uses: actions/download-artifact@v4
        with:
          name: kotlin-bindings
          path: protocol/bindings/kotlin/uniffi

      - name: Build Android NDK libraries
        working-directory: ./protocol/crates/kovanica-ffi
        run: |
          for target in aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android; do
            cargo ndk --target $target --api ${{ env.ANDROID_API }} build --release
          done

      - name: Copy .so files to Android module
        run: |
          mkdir -p apps/android/uniffi/src/main/jniLibs/arm64-v8a
          mkdir -p apps/android/uniffi/src/main/jniLibs/armeabi-v7a
          mkdir -p apps/android/uniffi/src/main/jniLibs/x86_64
          cp protocol/target/aarch64-linux-android/release/libkovanica_ffi.so \
             apps/android/uniffi/src/main/jniLibs/arm64-v8a/
          cp protocol/target/armv7-linux-androideabi/release/libkovanica_ffi.so \
             apps/android/uniffi/src/main/jniLibs/armeabi-v7a/
          cp protocol/target/x86_64-linux-android/release/libkovanica_ffi.so \
             apps/android/uniffi/src/main/jniLibs/x86_64/

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        working-directory: ./apps/android
        run: ./gradlew assembleDebug

      - name: Build Release APK
        working-directory: ./apps/android
        run: ./gradlew assembleRelease

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: apps/android/app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 30

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: apps/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────
  # Linux Tauri (.deb, .rpm, .AppImage) — non-blocking: requires
  # signing certs/secrets not available in public CI
  # ─────────────────────────────────────────────────────────────────
  linux-tauri:
    name: Linux Tauri
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            rpm \
            fuse \
            libfuse2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies (root workspace)
        run: npm ci

      - name: Build Tauri (Kovanica Console)
        working-directory: ./apps/console-kovanica
        run: npm run tauri build

      - name: Upload Linux bundles
        uses: actions/upload-artifact@v4
        with:
          name: linux-tauri-bundles
          path: |
            apps/console-kovanica/src-tauri/target/release/bundle/
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────
  # Windows Tauri (NSIS installer) — non-blocking: requires EV code
  # signing cert not available in public CI
  # ─────────────────────────────────────────────────────────────────
  windows-tauri:
    name: Windows Tauri
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          target: x86_64-pc-windows-gnu

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install mingw-w64
        run: choco install mingw -y

      - name: Add mingw to PATH
        run: echo "C:\ProgramData\chocolatey\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install dependencies (root workspace)
        run: npm ci

      - name: Build Tauri (Kovanica Console)
        working-directory: ./apps/console-kovanica
        run: npm run tauri build

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-tauri-installer
          path: apps/console-kovanica/src-tauri/target/x86_64-pc-windows-gnu/release/bundle/nsis/*.exe
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────
  # macOS Tauri (DMG) + iOS — non-blocking: requires Apple Developer
  # ID / iOS certs not available in public CI
  # ─────────────────────────────────────────────────────────────────
  macos-tauri-ios:
    name: macOS Tauri + iOS
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies (root workspace)
        run: npm ci

      - name: Build Tauri (macOS DMG)
        working-directory: ./apps/console-kovanica
        run: npm run tauri build

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: macos-tauri-dmg
          path: apps/console-kovanica/src-tauri/target/release/bundle/dmg/*.dmg
          retention-days: 30

      # iOS build (needs Xcode, signing certs — placeholder for now)
      - name: iOS build (placeholder)
        run: |
          echo "iOS build requires:"
          echo "  - Xcode (available on macos-latest)"
          echo "  - Apple Developer account + signing certs"
          echo "  - Provisioning profiles"
          echo "  - Run: cd apps/ios && xcodebuild -scheme KovanicaWallet -configuration Release"
        shell: bash

      - name: Download Swift bindings
        uses: actions/download-artifact@v4
        with:
          name: swift-bindings
          path: protocol/bindings/swift

      - name: Verify Swift bindings
        run: |
          ls -la protocol/bindings/swift/
          echo "Swift bindings ready for iOS integration"

  # ─────────────────────────────────────────────────────────────────
  # Release: publish artifacts on tag
  # ─────────────────────────────────────────────────────────────────
  release:
    name: Create Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, linux-tauri, windows-tauri, macos-tauri-ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: List artifacts
        run: find ./artifacts -type f | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./artifacts/android-debug-apk/app-debug.apk
            ./artifacts/android-release-apk/app-release-unsigned.apk
            ./artifacts/android-aab/app-release.aab
            ./artifacts/linux-tauri-bundles/**/*.deb
            ./artifacts/linux-tauri-bundles/**/*.rpm
            ./artifacts/linux-tauri-bundles/**/*.AppImage
            ./artifacts/windows-tauri-installer/*.exe
            ./artifacts/macos-tauri-dmg/*.dmg
          generate_release_notes: true
          draft: false
          prerelease: false

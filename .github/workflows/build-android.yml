name: Build Android

on:
  push:
    branches: [main]
    paths:
      - 'protocol/crates/kovanica-ffi/**'
      - '.github/workflows/build-android.yml'
  pull_request:
    branches: [main]
    paths:
      - 'protocol/crates/kovanica-ffi/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

jobs:
  build-aar:
    name: Build AAR (kovanica-ffi)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: protocol/crates/kovanica-ffi

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Setup Android NDK
        uses: android-actions/setup-android@v3
        with:
          ndk-version: r27c
          cache-key: ${{ runner.os }}-android-ndk-r27c
          # The action's default `packages` is `tools platform-tools`, but the
          # obsolete `tools` package was removed from Google's SDK repository.
          # sdkmanager then exits 1 with "Failed to find package 'tools'" and
          # the action throws before any of our code compiles. An empty string
          # skips the extra package install entirely. We do not need
          # platform-tools: this job only builds an AAR via cargo-ndk, which
          # needs the NDK (installed above via ndk-version) and nothing else.
          packages: ''

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            protocol/crates/kovanica-ffi/target
            protocol/crates/kovanica-ffi/android/src/main/jniLibs
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build AAR (both ABIs)
        run: |
          # setup-android exports ANDROID_NDK_ROOT into the *shell* environment,
          # but build-android.sh wants ANDROID_NDK_HOME. These cannot be bridged
          # with `${{ env.ANDROID_NDK_ROOT }}`: the `env` context is evaluated
          # before the job runs and never sees values a step wrote to
          # $GITHUB_ENV, so it always expands to the empty string. Export inside
          # the shell instead, falling back to ANDROID_SDK_ROOT/ndk if needed.
          if [ -z "$ANDROID_NDK_ROOT" ]; then
            ANDROID_NDK_ROOT="${ANDROID_NDK_HOME:-$ANDROID_SDK_ROOT/ndk/$(ls "$ANDROID_SDK_ROOT/ndk" 2>/dev/null | head -1)}"
          fi
          export ANDROID_NDK_HOME="$ANDROID_NDK_ROOT"
          chmod +x ./build-android.sh
          ./build-android.sh

      - name: Upload AAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: kovanica-ffi-aar
          path: protocol/crates/kovanica-ffi/android/
          if-no-files-found: error
          retention-days: 7

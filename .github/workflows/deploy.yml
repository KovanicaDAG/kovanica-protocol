name: CI & Deploy Kovanica Node

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    name: Build, Test, Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --check

      - name: Clippy (warnings are errors)
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests (unit + integration + doctests)
        run: cargo test

      - name: Build release binary
        run: cargo build --release --workspace

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: kovanica-node
          path: target/release/kovanica-node
          retention-days: 7

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: test
    # Arm by adding the VPS_* secrets AND setting the DEPLOY_ENABLED repo
    # variable to "true" (Settings -> Secrets and variables -> Actions ->
    # Variables). Until then this job is skipped instead of failing.
    #
    # Deploy is non-blocking: the Build/Test job above is the real CI gate.
    # A deploy failure here (e.g. the VPS being temporarily unreachable over
    # SSH) is surfaced as a warning on this job but does NOT fail the overall
    # workflow run, so an infrastructure outage can't red a green build. The
    # deploy is still attempted on every qualifying push and its failure stays
    # visible in the job's logs and status.
    continue-on-error: true
    if: >-
      github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && vars.DEPLOY_ENABLED == 'true'
    steps:
      - name: Download binary
        uses: actions/download-artifact@v4
        with:
          name: kovanica-node
          path: bin/

      - name: Upload binary to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_PRIVATE_KEY }}
          port: 2222
          source: "bin/kovanica-node"
          target: /root/

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_PRIVATE_KEY }}
          port: 2222
          script: |
            set -e
            # Non-interactive SSH does not source ~/.profile
            export PATH="$HOME/.cargo/bin:$PATH"
            cd /root/kovanica-protocol
            git pull --ff-only origin main
            # Replace binary with CI-built artifact (stop first: running
            # binaries cannot be overwritten — ETXTBSY). The node runs as a
            # systemd service — same supervisor as seed2/seed3. pm2 is
            # retired for Kovanica processes (2026-08-24).
            chmod +x ~/bin/kovanica-node
            systemctl stop kovanica-explorer || true
            # Atomic replace: seed2 executes the same path, so an in-place
            # copy would hit ETXTBSY. mv swaps the directory entry instead.
            install -m 0755 ~/bin/kovanica-node /usr/local/bin/kovanica-node.new
            mv -f /usr/local/bin/kovanica-node.new /usr/local/bin/kovanica-node
            systemctl start kovanica-explorer
            systemctl restart kovanica-seed2 || true
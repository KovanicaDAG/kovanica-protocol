name: CI & Deploy

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test-rust:
    name: Rust — Build, Test, Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --check

      - name: Clippy (warnings are errors)
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests (unit + integration + doctests)
        run: cargo test

      - name: Audit dependencies (cargo audit)
        uses: actions-rust-lang/audit@v1
        with:
          # Hard gate, consistent with fmt/clippy/test: any RustSec
          # advisory in the workspace fails the build. The workspace is
          # currently clean (0 advisories), so this never blocks a green
          # build today; it only catches future regressions.
          denyWarnings: true

      - name: Build release binary
        run: cargo build --release --workspace

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: kovanica-node
          path: target/release/kovanica-node
          retention-days: 7

  build-web:
    name: Web — Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build (node-server preset)
        run: npm run build:vps

      - name: Upload .output
        uses: actions/upload-artifact@v4
        with:
          name: kovanica-web-output
          path: web/.output/
          include-hidden-files: true
          retention-days: 7

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: [test-rust, build-web]
    # Deploy is non-blocking: the Build/Test jobs above are the real CI gate.
    # A deploy failure here (e.g. the VPS being temporarily unreachable over
    # SSH) is surfaced as a warning on this job but does NOT fail the overall
    # workflow run, so an infrastructure outage can't red a green build.
    continue-on-error: true
    if: >-
      github.event_name == 'push'
      && github.ref == 'refs/heads/main'
    steps:
      - name: Download binary
        uses: actions/download-artifact@v4
        with:
          name: kovanica-node
          path: bin/

      - name: Download web output
        uses: actions/download-artifact@v4
        with:
          name: kovanica-web-output
          path: web-output/

      - name: Upload artifacts to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_PRIVATE_KEY }}
          port: 2222
          source: "bin/kovanica-node,web-output/"
          target: /root/

      - name: Deploy node + web via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_PRIVATE_KEY }}
          port: 2222
          script: |
            set -e
            export PATH="$HOME/.cargo/bin:$PATH"

            # --- Rust node ---
            cd /root/kovanica-protocol
            git pull --ff-only origin main
            chmod +x ~/bin/kovanica-node
            systemctl stop kovanica-explorer || true
            install -m 0755 ~/bin/kovanica-node /usr/local/bin/kovanica-node.new
            mv -f /usr/local/bin/kovanica-node.new /usr/local/bin/kovanica-node
            systemctl start kovanica-explorer
            systemctl restart kovanica-seed2 || true

            # --- Web app ---
            mkdir -p /root/kovanica-web/.output
            rsync -a --delete /root/web-output/ /root/kovanica-web/.output/
            pm2 delete kovanica-web 2>/dev/null || true
            cd /root/kovanica-web
            HOST=127.0.0.1 PORT=3010 pm2 start .output/server/index.mjs --name kovanica-web
            pm2 save
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  hygiene:
    name: hygiene (secrets, transport, toml)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assert root commit has no parent
        run: |
          set -euo pipefail
          root=$(git rev-list --max-parents=0 HEAD | tail -n1)
          parents=$(git rev-list --parents -n1 "$root" | wc -w)
          echo "root commit: $root (fields: $parents => 1 means no parent)"
          if [ "$parents" -ne 1 ]; then
            echo "::error::root commit $root has a parent; repository must not be built from mirrored history"
            exit 1
          fi

      - name: gitleaks (full history)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y python3

      - name: TOML parse check
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sys, tomllib
          try:
              with open("protocol-params.toml", "rb") as fh:
                  data = tomllib.load(fh)
          except Exception as exc:  # noqa: BLE001
              print(f"::error::protocol-params.toml did not parse: {exc}")
              sys.exit(1)
          assert data.get("schema") == 1, "schema must be 1"
          assert "protocol_version" in data, "protocol_version missing"
          print("protocol-params.toml parsed; schema =", data["schema"])
          PY

      - name: Transport / address hygiene check
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ipaddress, re, sys
          from pathlib import Path

          text = "\n".join(
              p.read_text(errors="ignore")
              for p in Path(".").rglob("*")
              if p.is_file()
              and ".git" not in p.parts
              and p.suffix not in {".png", ".jpg", ".jpeg", ".gif", ".ico", ".pdf"}
              and p.name != "ci.yml"
          )

          failures = []

          # Disallowed hostnames / seed names / deployment ports.
          for pat in [r"seed\d*\.", r"\bkovanica\.online\b", r":8000\b", r":8545\b"]:
              for m in re.finditer(pat, text):
                  line = text[: m.start()].count("\n") + 1
                  failures.append(f"disallowed pattern {pat!r} at corpus line {line}")

          # IPv4 literals outside 127/8 and RFC5737 doc ranges.
          for m in re.finditer(r"\b(?:\d{1,3}\.){3}\d{1,3}\b", text):
              addr = m.group(0)
              try:
                  ip = ipaddress.ip_address(addr)
              except ValueError:
                  continue
              allowed = (
                  ip.is_loopback
                  or ip in ipaddress.ip_network("192.0.2.0/24")
                  or ip in ipaddress.ip_network("198.51.100.0/24")
                  or ip in ipaddress.ip_network("203.0.113.0/24")
              )
              if not allowed:
                  line = text[: m.start()].count("\n") + 1
                  failures.append(f"disallowed IPv4 {addr} at corpus line {line}")

          # IPv6 literals outside 127/8-derived, ::1 and 2001:db8::/32.
          for m in re.finditer(r"\b(?:[0-9a-fA-F]{1,4}:){2,}[0-9a-fA-F:]*\b", text):
              addr = m.group(0).strip(":")
              if not addr or addr.count(":") < 2:
                  continue
              try:
                  ip = ipaddress.ip_address(addr)
              except ValueError:
                  continue
              if ip.is_loopback or ip in ipaddress.ip_network("2001:db8::/32"):
                  continue
              line = text[: m.start()].count("\n") + 1
              failures.append(f"disallowed IPv6 {addr} at corpus line {line}")

          if failures:
              for f in failures:
                  print(f"::error::{f}")
              sys.exit(1)
          print("transport/address hygiene: OK")
          PY

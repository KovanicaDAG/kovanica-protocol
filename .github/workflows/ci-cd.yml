name: Deploy Consoles

# Deploy-only workflow (Phase 2 CI consolidation).
#
# The build/test gates that used to live in the old `Kovanica CI/CD` workflow
# moved to `.github/workflows/ci.yml`. What remains here is the VPS deploy step,
# kept separate and **manual or tag-triggered on purpose**: deploying to the VPS
# is an owner decision, not something a PR or a main push should trigger
# implicitly. See `docs/unify/DECISIONS.md` #8.
#
# The archived original is at `archive/workflows/` for reference.

on:
  workflow_dispatch:
  push:
    tags: ['v*']

# Read-only on the repo; the only side effect is the pm2 reload on the VPS.
permissions:
  contents: read

jobs:
  web-consoles:
    name: Build & deploy web consoles
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          # The repository is one npm workspace (DECISIONS #18): a single
          # package-lock.json at the root installs every member. Node 24
          # matches the npm 11 toolchain that wrote that lockfile.
          cache-dependency-path: package-lock.json

      - name: Install dependencies (root workspace)
        run: npm ci

      - name: Build Kovanica Console
        working-directory: ./apps/console-kovanica
        run: npm run build

      - name: Build Enterprise Console
        working-directory: ./apps/console-enterprise
        run: npm run build

      - name: Upload Kovanica Console
        uses: actions/upload-artifact@v4
        with:
          name: kovanica-console-web
          path: apps/console-kovanica/dist/
          retention-days: 30

      - name: Upload Enterprise Console
        uses: actions/upload-artifact@v4
        with:
          name: enterprise-console-web
          path: apps/console-enterprise/dist/
          retention-days: 30

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/kovanica/mobile/console/kovanica && pm2 reload ecosystem.config.js || pm2 start ecosystem.config.js
            cd /opt/kovanica/mobile/console/enterprise && pm2 reload ecosystem.config.js || pm2 start ecosystem.config.js
            pm2 save

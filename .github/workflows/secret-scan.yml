name: Secret scan

# Why this exists
# ---------------
# On 2026-09-26 three PoA authority *signing secrets* were found committed in
# plaintext in this repository, which is PUBLIC. They entered via `96e9225`
# ("chore(testnet): add real authority keys + generation example for PoA
# reset") and are still present in tracked files:
#
#   30-Operations/protocol--TESTNET_AUTHORITY_KEYS.md
#   99-Unfiled/protocol--docs--TESTNET_RESET_PROCEDURE.md
#   protocol/TESTNET_AUTHORITY_KEYS.md
#   protocol/docs/TESTNET_AUTHORITY_KEYS.md
#   protocol/docs/TESTNET_RESET_PROCEDURE.md
#
# One of them was live in a systemd unit on a public seed. The keys are burned
# and are being purged from history in a separate change.
#
# Two modes, because they catch different things:
#
#   working-tree (`gitleaks dir`)  — scans files as they are NOW. This is the
#       mode that would have caught the leak above: the secrets were pasted
#       into tracked markdown, and a history-only scan does not see the state
#       of the working tree.
#   history (`gitleaks git`)      — scans the commits an event introduced, so
#       a secret committed and later deleted is still caught.
#
# The history scan is RANGE-SCOPED rather than full-history on purpose: a
# full-history scan stays permanently red while the burned keys are reachable,
# and a permanently red gate gets ignored. Baselining them instead would
# require committing either the secret values or a fingerprint of them, and
# would silently permit any future secret in the same files.
#
# KNOWN LIMITATION, stated plainly: both modes will report the five files
# listed above until the purge lands, so both jobs are advisory
# (`continue-on-error`). They are annotated, not silenced. When the purge
# merges, delete `continue-on-error` from both jobs and the gate becomes
# blocking. Do not "fix" the noise with a baseline — that is how the next
# secret gets in.
#
# This is a backstop. The primary control is `generate_authority_keys` (#53),
# which writes secrets only to mode-0600 files and never to stdout. Enable
# GitHub push protection and secret scanning as repository settings as well;
# those are not expressible here.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  working-tree:
    name: gitleaks (working tree)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Advisory only until the burned keys are purged from the tracked files.
    # Gate is blocking — secrets removed from tracked files
    # Any finding should block. Do not baseline. (continue-on-error removed after purge)
    steps:
      - uses: actions/checkout@v4

      - name: Scan the working tree
        run: |
          set -uo pipefail
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          # `gitleaks dir` scans files as they are and does not read git
          # history. In 8.24.3 there is no `--no-git` flag to pass — the
          # subcommand itself is the mode.
          /tmp/gitleaks dir . --redact --verbose --no-banner --exit-code 7
          rc=$?
          if [ "$rc" -eq 7 ]; then
            echo "::error::A secret is present in a tracked file in the working tree."
            echo "::error::Treat the key as burned and rotate it. Do not baseline this away."
            exit 1
          elif [ "$rc" -ne 0 ]; then
            echo "::error::gitleaks failed with exit $rc (not a finding)."
            exit "$rc"
          fi

  history:
    name: gitleaks (commits introduced by this event)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Advisory only until the burned keys are purged from history.
    # Gate is blocking — secrets removed from tracked files
    # Any finding should block. Do not baseline. (continue-on-error removed after purge)
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks (version pinned)
        env:
          GITLEAKS_VERSION: 8.24.3
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          # Keep the canonical release filename: `sha256sum -c` resolves the
          # paths *inside* checksums.txt, so the file on disk must carry the
          # name the manifest uses.
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$archive" "${base}/${archive}"
          curl -fsSL -o checksums.txt "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${archive}\$" checksums.txt | sha256sum -c -
          tar -xzf "$archive" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Resolve the commit range this event introduced
        id: range
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            echo "log_opts=--log-opts=${BASE_SHA}..HEAD" >> "$GITHUB_OUTPUT"
          elif [ -n "${BEFORE_SHA:-}" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            echo "log_opts=--log-opts=${BEFORE_SHA}..HEAD" >> "$GITHUB_OUTPUT"
          else
            echo "log_opts=" >> "$GITHUB_OUTPUT"
          fi
          echo "range: '$(sed -n 's/^log_opts=//p' "$GITHUB_OUTPUT")' (empty = full history)"

      - name: Scan
        env:
          LOG_OPTS: ${{ steps.range.outputs.log_opts }}
        run: |
          set -uo pipefail
          # Run the pinned binary directly rather than through
          # gitleaks/gitleaks-action@v2. That action failed in ~6s with no
          # finding annotation and no gitleaks output at all — an action-level
          # failure, not a scan result — while the identical scan against the
          # same range passes locally. It also drags in a GITHUB_TOKEN,
          # comment/artifact toggles that moved between releases, and runs on
          # the deprecated Node 20 action runtime.
          #
          # This mirrors the working-tree job above: same version, same
          # --exit-code 7 contract, same treat-a-finding-as-fatal handling.
          if [ -n "$LOG_OPTS" ]; then
            gitleaks git "--log-opts=$LOG_OPTS" --redact --verbose --no-banner --exit-code 7
          else
            gitleaks git --redact --verbose --no-banner --exit-code 7
          fi
          rc=$?
          if [ "$rc" -eq 7 ]; then
            echo "::error::A secret was introduced by this event."
            echo "::error::Treat the key as burned and rotate it. Do not baseline this away."
            exit 1
          elif [ "$rc" -ne 0 ]; then
            echo "::error::gitleaks failed with exit $rc (not a finding)."
            exit "$rc"
          fi

name: kovanica wallet

on:
  push:
    branches: [main]
    paths:
      - "kovanica-wallet/**"
      - ".github/workflows/wallet.yml"
  pull_request:
    paths:
      - "kovanica-wallet/**"
      - ".github/workflows/wallet.yml"
  workflow_dispatch:

jobs:
  build-android-apk:
    name: Build Android wallet APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "wrapper"
          gradle-home-cache-cleanup: true

      # The standalone wallet is pure Kotlin/Compose (no FFI / native libs),
      # so no Rust toolchain / NDK / cargo-ndk is required here.
      - name: Assemble debug APK
        run: |
          chmod +x ./kovanica-wallet/android/gradlew || true
          ./kovanica-wallet/android/gradlew -p kovanica-wallet/android :app:assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kovanica-wallet-apk
          path: kovanica-wallet/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

[package]
name = "kovanica-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "UniFFI bindings: Kovanica light node (SPV-style sync + hybrid PoW/VRF-staked validation) for mobile apps"

[lib]
name = "kovanica_ffi"
crate-type = ["lib", "cdylib"]

[dependencies]
kovanica-dag = { path = "../kovanica-dag" }
kovanica-state = { path = "../kovanica-state" }
kovanica-node = { path = "../kovanica-node" }
hex.workspace = true
thiserror.workspace = true
uniffi = { version = "0.32", features = ["cli"] }

[package]
name = "kovanica-node"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Runnable node for the Kovanica Protocol: a line RPC over an in-memory Ledger with snapshot persistence."

[dependencies]
kovanica-dag = { path = "../kovanica-dag" }
kovanica-state = { path = "../kovanica-state" }
hex.workspace = true
blake3.workspace = true
socket2 = "0.5"
base64 = "0.22"
sha1 = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
prometheus = "0.13"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
metrics = "0.21"
metrics-exporter-prometheus = "0.13"
arbitrary = "1.3"
proptest = "1.0"

[dev-dependencies]
libfuzzer-sys = "0.4"

[lints.rust]
unsafe_code = "forbid"

server {
    listen 80;
    server_name pool.kovanica.local; # Replace with your domain

    root /path/to/nomp/website; # Replace with actual path to NOMP web interface
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api {
        proxy_pass http://127.0.0.1:8080; # NOMP API default port
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

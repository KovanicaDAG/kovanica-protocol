[versions]
agp = "8.13.2"
kotlin = "2.2.20"
composeBom = "2026.06.00"
material3 = "1.4.0"
activityCompose = "1.13.0"
lifecycle = "2.11.0"
workManager = "2.11.2"
jna = "5.14.0"
coreKtx = "1.16.0"
serialization = "1.7.2"
okhttp = "4.12.0"
coroutines = "1.10.2"

[libraries]
# Android Gradle Plugin
android-gradle-plugin = { group = "com.android.tools.build", name = "gradle", version.ref = "agp" }
kotlin-gradle-plugin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }

# Compose
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
ui = { group = "androidx.compose.ui", name = "ui", version.ref = "composeBom" }
ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics", version.ref = "composeBom" }
ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling", version.ref = "composeBom" }
ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview", version.ref = "composeBom" }
material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "material3" }
material-icons = { group = "androidx.compose.material", name = "material-icons-extended", version.ref = "composeBom" }
activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }

# WorkManager
work-runtime = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "workManager" }

# JNA (for UniFFI bindings)
jna = { group = "net.java.dev.jna", name = "jna", version.ref = "jna" }

# KotlinX
coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }

# Core KTX
core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }

# OkHttp (for light-sync HTTP)
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-urlconnection = { group = "com.squareup.okhttp3", name = "okhttp-urlconnection", version.ref = "okhttp" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
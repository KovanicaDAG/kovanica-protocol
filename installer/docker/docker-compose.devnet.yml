# Kovanica Devnet — Docker Compose
#
#   docker compose -f docker-compose.devnet.yml up -d
#   docker compose -f docker-compose.devnet.yml down -v   # destroys the chain
#
# ── Scope: DEVNET ONLY ──────────────────────────────────────────────────────
# This file deliberately runs one network. It is NOT a template for testnet or
# mainnet, and the two live seed nodes are NOT managed here.
#
# Reasons, in order of severity:
#
#  1. Chain identity is COMPILED IN, not configured. `NetworkProfile` in
#     kovanica-node/src/explorer.rs holds k, subsidy, premine, finality depth
#     and pruning depth as Rust constants. No env var can change them, so a
#     "one compose file, three networks" approach could never have produced
#     three different chains from this binary — it would have produced one
#     chain three times under three labels. Networks are separated by the
#     compiled profile, not by compose.
#
#  2. Devnet must never reach the public seeds. The devnet profile has an
#     EMPTY default peer list, so a container with no KOVANICA_PEERS comes up
#     with no peers. Do not "helpfully" add the public seeds here: a devnet
#     container that dials seed.kovanica.online is a public testnet node with
#     a devnet label, and the failure is silent.
#
#  3. The testnet seeds are already deployed on real hosts under systemd
#     (kovanica-testnet.service). Adding a container layer in front of inbound
#     P2P — where docker-proxy/NAT silently break connectivity — buys nothing
#     on single-purpose seed boxes.
#
#  4. Mainnet is DORMANT: it panics without KOVANICA_MAINNET_OVERRIDE=1, and
#     its authority set is an OPEN governance input (RFC-POA §0.7.2). There is
#     nothing to deploy yet, and a shareable image that boots "mainnet" on one
#     env var is a footgun, not a feature.
#
# Build context is ../.. = /root/kovanica, but the Dockerfile compiles from
# protocol/ (the actual cargo workspace). There is no Cargo.toml at the repo
# root — the previous `kovanica-install/docker/Dockerfile` path did not exist
# and the build could not have succeeded.

services:
  devnet-1:
    build:
      context: ../..
      dockerfile: installer/docker/Dockerfile
    container_name: kovanica-devnet-1
    restart: unless-stopped
    ports:
      # Bound to loopback: a devnet is not a public service. Drop the
      # 127.0.0.1: prefix only if you intend to expose it deliberately.
      - "127.0.0.1:18082:8080"   # explorer / JSON API
      - "127.0.0.1:19002:9000"   # P2P
      - "127.0.0.1:19092:9090"   # metrics
    volumes:
      - devnet-1-data:/var/lib/kovanica
    environment:
      # Selects the devnet profile. An unrecognised value now panics rather
      # than falling back to testnet.
      - KOVANICA_NETWORK=devnet
      - KOVANICA_DATA=/var/lib/kovanica
      # 0.0.0.0 INSIDE the container so the other node can reach it; the
      # published port above is what restricts host exposure.
      - KOVANICA_LISTEN=0.0.0.0:9000
      # Empty on purpose — see note 2. A second node joins via this list.
      - KOVANICA_PEERS=off
      - KOVANICA_SLOT_DURATION=3000
      - KOVANICA_PRODUCE=1
      - KOVANICA_PRODUCE_SECS=5
      - KOVANICA_FAUCET=1
      # Chain-wipe switch. Appropriate on an isolated devnet, NEVER on testnet
      # or mainnet.
      - KOVANICA_ALLOW_RESET=1
      - KOVANICA_OPERATOR=1
      - KOVANICA_METRICS_LISTEN=0.0.0.0:9090
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/api/head"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  devnet-1-data:

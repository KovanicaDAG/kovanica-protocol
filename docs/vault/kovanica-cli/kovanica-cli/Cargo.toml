[package]
name = "kovanica-cli"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
description = "Command-line client for the Kovanica (KVNC) testnet BlockDAG"
repository = "https://github.com/KovanicaDAG/kovanica-cli"

[[bin]]
name = "kovanica"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
ureq = "2"
serde_json = "1"
hex = "0.4"
getrandom = "0.2"
anyhow = "1"
# Reuse the node's own address + key logic so the CLI can never drift from the
# ledger. `kovanica-state` is a workspace member of the node repo; cargo builds
# just that package (and its `kovanica-dag` path dep) from the git checkout.
kovanica-state = { git = "https://github.com/KovanicaDAG/kovanica-node" }

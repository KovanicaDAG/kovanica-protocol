# Kovanica protocol parameters — public draft
#
# This file is the single machine-readable source of published protocol
# parameters. Every entry cites the implementation it was read from.
#
# status = "frozen"  -> treated as stable for the public testnet.
# status = "pending" -> explicitly expected to change before mainnet; the
#                       entry carries `pending_reason`.
#
# A change to a `frozen` value is a protocol change and must be recorded in
# PROTOCOL-CHANGES.md.
#
# Sources are cited as "path:line@<commit>". All citations below were read from
# the kovanica node at commit 5567bdfe3163e253c10dc63c736426815d891c4c.

schema = 1
protocol_version = "0.1.0-draft"


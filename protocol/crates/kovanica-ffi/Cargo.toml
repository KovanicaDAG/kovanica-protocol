[package]
name = "kovanica-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "UniFFI bindings: Kovanica light node (SPV-style sync + PoA authority admission) for mobile apps"

[lib]
name = "kovanica_ffi"
# staticlib: linked into the iOS/macOS xcframework (App Store forbids shipping
# our own dylibs on iOS). cdylib: Android (JNA) + the bindgen/drift-guard
# library build. "lib": the workspace test suite.
crate-type = ["lib", "staticlib", "cdylib"]

[dependencies]
kovanica-dag = { path = "../kovanica-dag" }
kovanica-state = { path = "../kovanica-state" }
kovanica-node = { path = "../kovanica-node" }
kovanica-wallet = { path = "../kovanica-wallet" }
kovanica-chat = { path = "../kovanica-chat" }
anyhow.workspace = true
ed25519-dalek = { workspace = true }
hex.workspace = true
thiserror.workspace = true
bincode.workspace = true
uniffi.workspace = true

[dev-dependencies]
# The zero-entropy known-answer phrase is built from entropy bytes, so no
# mnemonic appears in the derivation tests.
bip39 = { workspace = true, features = ["std"] }

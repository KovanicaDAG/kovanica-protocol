[package]
name = "kovanica-wallet"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Client-side Kovanica (KVNC) wallet: frozen SLIP-0010 ed25519 key derivation and local key storage"

[dependencies]
anyhow.workspace = true
bip39 = { workspace = true, features = ["rand", "std"] }
getrandom.workspace = true
hex.workspace = true
kovanica-state = { path = "../kovanica-state" }
# Canonical SLIP-0010 / BIP-39 derivation and address encoding live in the
# published SDK crate; this crate re-exports them (`src/slip10.rs`) instead of
# carrying a second implementation. See `docs/unify/DECISIONS.md`.
kovanica-keys = { path = "../../../sdk/crates/kovanica-keys" }

[dev-dependencies]
# Integration tests assert on the rendered address form, which lives in the
# ledger crate. Regular dependencies are not visible to `tests/`.
kovanica-state = { path = "../kovanica-state" }
# The shared golden-vector file (`protocol/testvectors/vectors.json`) is JSON:
# the generator example writes it and the consumer test parses it.
serde_json = { workspace = true }

[lints.rust]
unsafe_code = "forbid"

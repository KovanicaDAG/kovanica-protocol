version: "3.9"

services:
  vllm:
    image: vllm/vllm-openai:latest
    command: >
      --model Qwen/Qwen2.5-Coder-32B-Instruct-AWQ
      --quantization awq
      --max-model-len 32768
      --gpu-memory-utilization 0.90
    ports:
      - "8000:8000"
    volumes:
      - vllm-cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: ["gpu"]
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    restart: unless-stopped

  agent-api:
    build: ./agent
    environment:
      - VLLM_BASE_URL=http://vllm:8000/v1
      - QDRANT_URL=http://qdrant:6333
      - SANDBOX_IMAGE=kovanica-sandbox:latest
      - REPOS_PATH=/repos
    volumes:
      - ./repos:/repos:ro
      # ⚠ SECURITY: mounting docker.sock gives agent-api effective root on
      # the host — it can launch any container, not just the sandbox one.
      # Fine for a first internal deployment; before exposing this beyond
      # a trusted DevTeam, replace with a scoped "sandbox-runner" sidecar
      # that agent-api talks to over a restricted Unix socket/API instead
      # of touching the Docker socket directly.
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - vllm
      - qdrant
    ports:
      - "8080:8080"
    restart: unless-stopped

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    environment:
      - OPENAI_API_BASE_URL=http://vllm:8000/v1
    ports:
      - "3000:8080"
    volumes:
      - webui-data:/app/backend/data
    depends_on:
      - vllm
    restart: unless-stopped

  # Not run as a persistent service. Build it once:
  #   docker compose --profile build-only build sandbox-image
  # agent-api then spawns short-lived containers from this image per
  # cargo call via the Docker SDK (see agent/graph.py: run_cargo_command).
  sandbox-image:
    build: ./sandbox
    image: kovanica-sandbox:latest
    profiles: ["build-only"]

volumes:
  vllm-cache:
  qdrant-data:
  webui-data:
